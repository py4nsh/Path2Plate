<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path2Plate - Food Delivery</title>
<style>
  :root{
    --orange:#ff6b2c; --orange-dark:#e5541a; --bg:#fff7f1; --card:#ffffff;
    --text:#2b2320; --muted:#8a7f79; --line:#f0e3da; --green:#22a559; --red:#e03a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:linear-gradient(120deg,var(--orange),#ff9a4d);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 3px 12px rgba(255,107,44,.35)}
  .logo{font-size:24px;font-weight:800;letter-spacing:.3px}
  .logo small{display:block;font-size:11px;font-weight:500;opacity:.9;letter-spacing:.5px}
  nav{display:flex;gap:6px}
  nav button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  nav button:hover{background:rgba(255,255,255,.3)}
  nav button.active{background:#fff;color:var(--orange-dark)}
  .user{font-size:14px;display:flex;align-items:center;gap:10px}
  .user button{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12px}
  main{max-width:1100px;margin:22px auto;padding:0 16px}
  .card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(80,40,10,.07);margin-bottom:18px}
  h2{font-size:20px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;margin:5px 0 12px;background:#fff;outline:none}
  input:focus,select:focus{border-color:var(--orange)}
  label{font-size:13px;font-weight:600;color:var(--muted)}
  .btn{background:var(--orange);color:#fff;border:0;padding:11px 20px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--orange-dark)}
  .btn.light{background:#fff1e8;color:var(--orange-dark)}
  .btn.light:hover{background:#ffe3d1}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.danger{background:#fdeaea;color:var(--red)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .auth{max-width:420px;margin:30px auto}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;padding:9px;border:0;border-radius:8px;background:#f7efe9;cursor:pointer;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--orange);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
  .rest{cursor:pointer;transition:.18s;border:2px solid transparent;margin:0}
  .rest:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:0 8px 20px rgba(255,107,44,.2)}
  .rest .emoji{font-size:46px;background:#fff1e8;border-radius:12px;width:78px;height:78px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .rest h3{font-size:18px}
  .tag{display:inline-block;background:#fff1e8;color:var(--orange-dark);font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;margin:6px 6px 0 0}
  .tag.g{background:#e6f6ec;color:var(--green)}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:850px){.layout{grid-template-columns:1fr}}
  .item{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border:0}
  .dot{display:inline-block;width:14px;height:14px;border:2px solid var(--green);border-radius:3px;position:relative;margin-right:9px;vertical-align:middle}
  .dot::after{content:"";position:absolute;inset:2px;background:var(--green);border-radius:50%}
  .dot.n{border-color:var(--red)} .dot.n::after{background:var(--red)}
  .price{color:var(--muted);font-size:14px;margin-left:24px}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--orange);background:#fff;color:var(--orange);font-size:18px;font-weight:700;cursor:pointer;line-height:1}
  .qty button:hover{background:var(--orange);color:#fff}
  .qty span{min-width:18px;text-align:center;font-weight:700}
  .cart{position:sticky;top:12px;margin:0}
  .row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
  .row.total{font-weight:800;font-size:17px;border-top:2px dashed var(--line);margin-top:8px;padding-top:12px}
  .empty{text-align:center;color:var(--muted);padding:26px 0}
  .back{background:none;border:0;color:var(--orange-dark);font-weight:600;cursor:pointer;font-size:14px;margin-bottom:12px}
  .success{text-align:center}
  .success .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .map{width:100%;background:#fffaf6;border:1px solid var(--line);border-radius:12px}
  .map .edge{stroke:#e0d2c8;stroke-width:3}
  .map .edge.hl{stroke:var(--orange);stroke-width:6;stroke-linecap:round}
  .map .km{font-size:11px;fill:var(--muted)}
  .map .node{fill:#fff;stroke:#b9a99d;stroke-width:3}
  .map .node.hl{stroke:var(--orange)}
  .map .node.start{fill:var(--green);stroke:var(--green)}
  .map .node.end{fill:var(--red);stroke:var(--red)}
  .map .lbl{font-size:12px;font-weight:600;fill:var(--text)}
  .legend{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .track{display:flex;margin:14px 0 4px}
  .step{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative}
  .step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:4px;background:var(--line);z-index:0}
  .step:first-child::before{display:none}
  .step .c{width:26px;height:26px;border-radius:50%;background:var(--line);margin:0 auto 5px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .step.done{color:var(--text)} .step.done .c{background:var(--green)} .step.done::before{background:var(--green)}
  .step.now .c{background:var(--orange);box-shadow:0 0 0 5px rgba(255,107,44,.2)}
  .ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .status{padding:4px 12px;border-radius:14px;font-size:12px;font-weight:700;background:#fff1e8;color:var(--orange-dark)}
  .status.Delivered{background:#e6f6ec;color:var(--green)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;padding:8px;border-bottom:2px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:750px){.two{grid-template-columns:1fr}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#2b2320;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;opacity:0;transition:.3s;z-index:99}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{background:var(--red)}
  .qrow{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .qchip{background:#fff1e8;color:var(--orange-dark);font-weight:700;font-size:13px;padding:4px 10px;border-radius:12px}
  .qchip.first{background:var(--orange);color:#fff}
  .paybox{background:#fffaf6;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}
  .search{max-width:420px;margin:0 0 14px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}

  /* Path2Plate refresh: warm, simple and intentionally student-project sized */
  :root{--orange:#e85d2a;--orange-dark:#c9471b;--bg:#fff9f3;--card:#fff;--text:#292522;--muted:#766e68;--line:#eee2d8;--green:#2f7650;--red:#c94b43;--deep:#24352b}
  body{background:linear-gradient(180deg,#fff7ef 0,#fffaf6 280px,var(--bg) 100%);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
  header{background:var(--deep);padding:13px max(20px,calc((100vw - 1160px)/2));box-shadow:0 4px 18px rgba(25,42,31,.14);position:sticky;top:0;z-index:20}
  .logo{font-size:23px;letter-spacing:-.5px}.logo small{color:#d6e2d8;letter-spacing:.2px}
  nav{gap:5px;flex-wrap:wrap}nav button{border-radius:10px;padding:9px 13px;background:rgba(255,255,255,.09)}nav button.active{color:var(--deep);background:#fff}
  main{max-width:1160px;margin:28px auto;padding:0 20px;min-height:calc(100vh - 145px)}
  .card{border:1px solid rgba(238,226,216,.9);border-radius:16px;box-shadow:0 5px 18px rgba(66,43,27,.055);padding:20px}
  h2{font-size:21px;letter-spacing:-.35px}h3{letter-spacing:-.2px}.sub{line-height:1.55}
  input,select{border-radius:10px;border-color:#e8ddd4}input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,93,42,.1)}
  .btn{border-radius:10px;background:var(--orange);box-shadow:0 2px 5px rgba(201,71,27,.12)}.btn:hover{background:var(--orange-dark);transform:translateY(-1px)}.btn.light{background:#f5eee8;color:var(--deep);box-shadow:none}
  .auth{max-width:470px;margin:44px auto;padding:28px}.tabs button{border-radius:10px}.tabs button.on{background:var(--deep)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
  .rest{position:relative;overflow:hidden;padding:0;border:1px solid var(--line);background:#fff;transition:transform .18s,box-shadow .18s}
  .rest:hover{transform:translateY(-3px);border-color:#f0c7b4;box-shadow:0 12px 24px rgba(80,40,10,.1)}
  .rest .emoji{width:100%;height:132px;margin:0 0 14px;border-radius:0;background:linear-gradient(135deg,#fff0e4,#f7e8d9);font-size:66px}
  .rest h3,.rest .sub,.rest .tag{margin-left:17px;margin-right:17px}.rest h3{font-size:18px}.rest .tag{margin-bottom:17px}
  .tag{background:#fff0e6;color:#b94b24;border-radius:7px;padding:4px 9px}.tag.g{background:#e8f2e9;color:#2f7650}
  .layout{grid-template-columns:minmax(0,1fr) 350px;gap:20px}.item{gap:12px}.item>div:first-child{line-height:1.7}
  .qty button{border-radius:9px}.cart{top:86px}.row.total{color:var(--deep)}
  .pay-options .card{margin:0;padding:14px;border-radius:12px}.pay-options input{width:auto;margin:0;accent-color:var(--orange)}
  .pay-options label:has(input:checked){border-color:var(--orange);background:#fff8f2;box-shadow:0 0 0 2px rgba(232,93,42,.08)}
  .paybox{background:#f7faf7}.map{background:#fffdfb}.status{border-radius:7px}.status.Delivered{background:#e8f2e9;color:var(--green)}
  .toast{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}footer{color:#857a72;padding:24px}
  .home-hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:center;background:var(--deep);color:#fff;border-radius:18px;padding:28px 30px;margin-bottom:24px;overflow:hidden;position:relative}
  .home-hero h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-1px;margin-bottom:9px}.home-hero p{color:#dce6dd;max-width:560px;line-height:1.6;font-size:14px}
  .hero-art{font-size:92px;text-align:center;filter:drop-shadow(0 10px 12px rgba(0,0,0,.16))}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#ffbf9e;font-weight:800;margin-bottom:9px}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:20px 0 12px}.section-head .sub{margin:0}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.filter-chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer}.filter-chip.active{background:var(--deep);border-color:var(--deep);color:#fff}
  .search-wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search-wrap .search{flex:1;min-width:220px;margin:0 0 14px}.search-wrap select{width:auto;min-width:150px}
  .fav-btn{position:absolute;right:12px;top:12px;border:0;background:#fff;color:#b94b24;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.menu-item:last-child{border:0}.menu-name{font-weight:700}.menu-meta{font-size:13px;color:var(--muted);margin-top:3px}.menu-item .qty{flex-shrink:0}
  .auth-intro{background:#fff4eb;border-radius:12px;padding:14px;margin-bottom:18px;color:#75432e;font-size:13px;line-height:1.5}
  .step-label{display:flex;gap:8px;align-items:center;margin:8px 0 18px;color:var(--muted);font-size:12px}.step-label span{background:#e8f2e9;color:var(--green);padding:5px 9px;border-radius:20px;font-weight:700}
  @media(max-width:850px){.layout{grid-template-columns:1fr}.cart{position:static}.home-hero{grid-template-columns:1fr}.hero-art{display:none}}
  @media(max-width:600px){header{padding:12px 14px}.logo{font-size:20px}header{align-items:flex-start}nav{order:3;width:100%}nav button{flex:1;padding:8px 7px;font-size:12px}.user{margin-left:auto}main{padding:0 13px;margin:18px auto}.home-hero{padding:22px}.auth{margin:20px auto;padding:21px}.rest .emoji{height:112px}}

  /* Extra tracking + admin dashboard polish (kept lightweight for a student project) */
  .tracking-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(115deg,#24352b,#31513d);color:#fff;border-radius:15px;padding:18px 20px;margin:12px 0 16px;overflow:hidden}
  .tracking-hero h3{font-size:18px;margin-bottom:5px}.tracking-hero p{font-size:13px;color:#dce8df;line-height:1.5}
  .rider-art{font-size:48px;min-width:78px;text-align:center;filter:drop-shadow(0 6px 7px rgba(0,0,0,.18));animation:rider-bob 1.5s ease-in-out infinite}
  @keyframes rider-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  .track{gap:0}.step{line-height:1.35}.step .c{font-size:15px}
  .map .route-guide{fill:none;stroke:#e85d2a;stroke-width:2;stroke-dasharray:7 7;opacity:.25}
  .map .bike{font-size:25px;paint-order:stroke;stroke:#fff;stroke-width:2px;stroke-linejoin:round}
  .map-wrap{position:relative}.map-caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0;color:var(--muted);font-size:12px}
  .admin-title{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .admin-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 3px 12px rgba(50,40,30,.035)}
  .kpi .kpi-label{font-size:12px;color:var(--muted);font-weight:600}.kpi .kpi-value{font-size:25px;font-weight:800;color:var(--deep);margin:5px 0 2px}.kpi .kpi-note{font-size:11px;color:var(--muted)}
  .admin-overview{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  .status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:11px 0;font-size:13px}
  .status-line .bar{height:8px;background:#f2ece6;border-radius:20px;overflow:hidden;flex:1;max-width:48%}
  .status-line .bar i{display:block;height:100%;border-radius:20px;background:var(--orange)}
  .admin-badge{display:inline-flex;align-items:center;gap:6px;background:#e8f2e9;color:var(--green);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .admin-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  @media(max-width:800px){.admin-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-overview{grid-template-columns:1fr}}
  @media(max-width:460px){.admin-kpis{gap:8px}.kpi{padding:11px}.kpi .kpi-value{font-size:21px}.tracking-hero{padding:15px}.rider-art{font-size:38px;min-width:55px}}


  /* Order confirmation: reference-inspired layout in Path2Plate colours */
  .confirm-page{max-width:900px;margin:0 auto 28px}
  .confirm-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .confirm-heading .back{margin:0}
  .confirm-brand{font-size:13px;font-weight:900;letter-spacing:1.5px;color:var(--deep)}
  .confirm-brand span{display:block;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700;text-align:right;margin-top:2px}
  .confirm-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 28px rgba(48,45,35,.07);overflow:hidden}
  .confirm-success{display:flex;align-items:center;gap:13px;padding:2px 2px 17px;border-bottom:1px solid var(--line)}
  .confirm-check{width:43px;height:43px;display:grid;place-items:center;border-radius:50%;background:#e6f2e8;color:var(--green);font-size:25px;font-weight:900;flex-shrink:0}
  .confirm-success h2{margin:0 0 3px;color:var(--deep)}.confirm-success p{font-size:13px;color:var(--muted)}
  .confirm-pill{margin-left:auto;background:#e8f2e9;color:var(--green);font-size:12px;font-weight:800;padding:7px 12px;border-radius:30px;white-space:nowrap}
  .confirm-card .track{padding:17px 5px 13px;margin:0 0 8px}
  .confirm-card .step{font-size:11px;font-weight:700}
  .confirm-map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
  .confirm-map-head h3{font-size:17px;margin:4px 0}.confirm-map-head h3 span{color:var(--orange);padding:0 4px}
  .eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:900;color:var(--orange)}
  .confirm-map-head .sub{font-size:12px;margin:0}
  .route-chip{font-size:12px;font-weight:800;color:var(--deep);background:#f1f3ed;border-radius:30px;padding:8px 12px}
  .confirm-map{background:#f7f7ee;border:1px solid #e8eadf;border-radius:16px;padding:8px;overflow:hidden}
  .confirm-map .map{border:0;border-radius:11px;background:#f7f7ee;display:block}
  .confirm-map .map .edge{stroke:#d9dfd0}.confirm-map .map .edge.hl{stroke:var(--orange)}
  .confirm-map .map .route-guide{opacity:.85;stroke-width:4;stroke-dasharray:8 8}
  .confirm-map .map .lbl{font-size:11px}
  .confirm-map .legend{padding:0 7px 5px;font-size:11px}
  .confirm-eta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(105deg,#f5f2e9,#fff8f0);border:1px solid #eee6d8;border-radius:15px;padding:16px 20px;margin:15px 0}
  .eta-number{font-size:48px;line-height:1.05;font-weight:900;letter-spacing:-2px;color:var(--orange);margin:3px 0}
  .eta-number small{font-size:19px;letter-spacing:0}.confirm-eta p{font-size:12px;color:var(--muted)}
  .eta-art{font-size:48px;filter:drop-shadow(0 5px 5px rgba(0,0,0,.12));animation:rider-bob 1.5s ease-in-out infinite;padding:0 10px}
  .confirm-details{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;padding:3px 2px 0}
  .confirm-section-title{display:flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--deep)}
  .confirm-section-title>span{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#f6eee4}
  .confirm-section-title small{margin-left:auto;color:var(--muted);font-weight:500}
  .confirm-detail-block .row{font-size:13px;padding:7px 0}
  .confirm-total{border-left:1px solid var(--line);padding-left:18px;display:flex;flex-direction:column;gap:11px;font-size:12px}
  .confirm-total>div{display:flex;justify-content:space-between;gap:10px}.confirm-total span{color:var(--muted)}
  .confirm-total b{color:var(--text);text-align:right}.confirm-total .grand-total{border-top:1px solid var(--line);padding-top:13px;margin-top:auto;align-items:center}
  .grand-total strong{font-size:25px;color:var(--deep)}
  .confirm-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
  .confirm-footnote{text-align:center;color:var(--muted);font-size:11px;margin:8px 0}
  @media(max-width:650px){.confirm-card{padding:15px;border-radius:17px}.confirm-success{gap:9px}.confirm-success h2{font-size:18px}.confirm-pill{font-size:10px;padding:6px 8px}.confirm-card .track{padding:15px 0 10px}.confirm-card .step{font-size:10px}.confirm-card .step .c{width:24px;height:24px}.confirm-details{grid-template-columns:1fr;gap:12px}.confirm-total{border-left:0;border-top:1px solid var(--line);padding:13px 0 0}.confirm-map-head h3{font-size:15px}.confirm-map{padding:4px}.confirm-map .map .lbl{font-size:9px}.confirm-eta{padding:13px 15px}.eta-number{font-size:42px}.eta-art{font-size:40px}}

</style>
</head>
<body>

<header>
  <div class="logo">🍽️ Path2Plate<small>Food delivery with shortest-route optimizer</small></div>
  <nav>
    <button data-view="order" class="active">Order Food</button>
    <button data-view="orders">My Orders</button>
    <button data-view="admin">Admin</button>
  </nav>
  <div class="user" id="userBox"></div>
</header>

<main id="app"></main>
<footer>Path2Plate · Built as a second-year C++ / DSA student project · Demo only</footer>
<div class="toast" id="toast"></div>

<script>
// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
const app = $("#app");
const state = { view:"order", customer:null, map:null, restaurant:null, restaurants:[], menu:[], cart:{}, bill:null, placed:null, authMode:"login", adminPin:null, adminRest:"1", paymentMethod:"Cash on Delivery", cuisineFilter:"All", favorites:JSON.parse(localStorage.getItem("p2p_favorites")||"[]") };

async function api(path, opts){
  const r = await fetch(path, opts);
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || "Something went wrong");
  return d;
}
const post = (p, b, h={}) => api(p, {method:"POST", headers:h, body:new URLSearchParams(b)});
const cartStr = lines => lines.map(l => l.id + ":" + l.qty).join(",");
const adminH = () => ({"X-Admin-Pin": state.adminPin});
const money = n => "₹" + Number(n).toFixed(Number(n) % 1 ? 2 : 0);

function toast(msg, err=false){
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 2600);
}
async function safe(fn){ try { return await fn(); } catch(e){ toast(e.message, true); } }

// ---------------- route map (SVG) ----------------
function drawMap(path=[]){
  const {nodes, edges} = state.map;
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const hlEdge = new Set();
  for(let i=0;i<path.length-1;i++){ hlEdge.add(path[i]+"-"+path[i+1]); hlEdge.add(path[i+1]+"-"+path[i]); }
  let svg = `<svg class="map" viewBox="0 0 660 440" role="img" aria-label="Delivery route map">`;
  edges.forEach(e => {
    const a = byId[e.a], b = byId[e.b], hl = hlEdge.has(e.a+"-"+e.b);
    svg += `<line class="edge ${hl?"hl":""}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    svg += `<text class="km" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-5}" text-anchor="middle">${e.km} km</text>`;
  });
  let routeD = "";
  if(path.length > 1){
    routeD = path.map((id,i) => `${i===0?"M":"L"} ${byId[id].x} ${byId[id].y}`).join(" ");
    svg += `<path id="deliveryRouteGuide" class="route-guide" d="${routeD}"/>`;
  }
  nodes.forEach(n => {
    let cls = "node";
    if(path.includes(n.id)) cls += " hl";
    if(path.length && n.id === path[0]) cls += " start";
    if(path.length && n.id === path[path.length-1]) cls += " end";
    svg += `<circle class="${cls}" cx="${n.x}" cy="${n.y}" r="10"/>`;
    svg += `<text class="lbl" x="${n.x}" y="${n.y+26}" text-anchor="middle">${n.name}</text>`;
  });
  if(path.length > 1){
    svg += `<text class="bike" x="0" y="0" text-anchor="middle">🛵<animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#deliveryRouteGuide"/></animateMotion></text>`;
  }
  return svg + `</svg><div class="legend"><span><i style="background:var(--green)"></i>Restaurant / start</span><span><i style="background:var(--red)"></i>Delivery location</span><span><i style="background:var(--orange)"></i>Shortest route (Dijkstra)</span>${path.length>1?'<span>🛵 Demo rider animation</span>':''}</div>`;
}

// ---------------- header ----------------
function renderHeader(){
  const u = $("#userBox");
  u.innerHTML = state.customer
    ? `👤 ${state.customer.name} · 📍 ${state.customer.location} <button onclick="logout()">Logout</button>` : "";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
}
function logout(){
  localStorage.removeItem("p2p_customer"); state.customer = null; state.restaurant = null;
  state.cart = {}; state.placed = null; render();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });

// ---------------- main render ----------------
function render(){
  renderHeader();
  if(state.view === "admin") return renderAdmin();
  if(!state.customer) return renderAuth();
  if(state.view === "orders") return renderMyOrders();
  if(state.view === "payment") return renderPayment();
  if(state.placed) return renderPlaced();
  if(state.restaurant) return renderMenu();
  renderRestaurants();
}

// ---------------- login / register ----------------
function renderAuth(){
  const opts = state.map.nodes.map(n => `<option value="${n.id}">${n.name}</option>`).join("");
  const reg = state.authMode === "register";
  app.innerHTML = `
  <div class="card auth">
    <div class="eyebrow" style="color:var(--orange)">GOOD FOOD, A SHORTER ROUTE</div><h2>Welcome to Path2Plate 👋</h2>
    <p class="sub">Your local food ordering demo. Sign in to explore restaurants and place an order.</p><div class="auth-intro">🍴 Browse nearby restaurants, add your favourites and follow the delivery route calculated by our C++ shortest-path algorithm.</div>
    <div class="tabs">
      <button class="${!reg?"on":""}" onclick="state.authMode='login';render()">Login</button>
      <button class="${reg?"on":""}" onclick="state.authMode='register';render()">Register</button>
    </div>
    ${reg ? `<label>Full name</label><input id="name" placeholder="e.g. Rahul Sharma">` : ""}
    <label>Phone number</label><input id="phone" maxlength="10" placeholder="10-digit mobile number">
    ${reg ? `<label>Delivery location</label><select id="loc">${opts}</select>` : ""}
    <button class="btn" style="width:100%" onclick="submitAuth()">${reg?"Create account":"Login"}</button>
  </div>`;
}
function submitAuth(){ safe(async () => {
  const phone = $("#phone").value.trim();
  let c;
  if(state.authMode === "register")
    c = await post("/api/register", {name:$("#name").value, phone, location_id:$("#loc").value});
  else c = await api("/api/login?phone=" + encodeURIComponent(phone));
  state.customer = c; localStorage.setItem("p2p_customer", c.id);
  toast("Welcome, " + c.name + "!"); render();
});}

// ---------------- restaurants ----------------
async function renderRestaurants(){
  state.restaurants = await api("/api/restaurants?loc=" + state.customer.location_id);
  app.innerHTML = `<section class="home-hero"><div><div class="eyebrow">WELCOME TO PATH2PLATE</div><h1>Good food, delivered<br>the smarter way.</h1><p>Find something tasty nearby. Compare delivery distance and estimated time powered by our C++ route finder.</p></div><div class="hero-art" aria-hidden="true">🍔 🍕<br>🥗 🍜</div></section>
    <div class="section-head"><div><h2>Restaurants near ${state.customer.location}</h2><p class="sub">Pick a place and explore its menu.</p></div><span class="tag g">📍 ${state.customer.location}</span></div>
    <div class="search-wrap"><input class="search" id="restaurantSearch" placeholder="⌕  Search restaurant or cuisine..." oninput="filterRestaurants()"><select id="restaurantSort" onchange="filterRestaurants()"><option value="default">Sort: Recommended</option><option value="eta">Fastest delivery</option><option value="distance">Nearest first</option><option value="name">Name: A to Z</option></select></div>
    <div class="filter-row" id="cuisineFilters"></div><div id="restaurantCards" class="grid"></div>`;
  renderCuisineFilters(); filterRestaurants();
}
function renderCuisineFilters(){
  const cuisines=["All",...new Set(state.restaurants.map(r=>r.cuisine).filter(Boolean))];
  const el=$('#cuisineFilters');
  el.innerHTML=cuisines.map(c=>`<button class="filter-chip ${state.cuisineFilter===c?'active':''}" onclick="state.cuisineFilter=${JSON.stringify(c)};renderCuisineFilters();filterRestaurants()">${c}</button>`).join('');
}
function toggleFavorite(id){
  state.favorites=state.favorites.includes(String(id))?state.favorites.filter(x=>x!==String(id)):[...state.favorites,String(id)];
  localStorage.setItem('p2p_favorites',JSON.stringify(state.favorites));filterRestaurants();
}
function filterRestaurants(){
  const q = (($('#restaurantSearch') && $('#restaurantSearch').value) || '').toLowerCase();
  let list = state.restaurants.filter(r => (r.name + ' ' + r.cuisine).toLowerCase().includes(q) && (state.cuisineFilter==='All'||r.cuisine===state.cuisineFilter));
  const sort=$('#restaurantSort')?.value||'default';
  if(sort==='eta')list.sort((a,b)=>a.eta-b.eta);else if(sort==='distance')list.sort((a,b)=>a.distance-b.distance);else if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
  $('#restaurantCards').innerHTML = list.map(r => `
      <div class="card rest" onclick="openRestaurant('${r.id}','${r.name.replace(/'/g,"\\'")}')">
        <button class="fav-btn" title="Save favourite" onclick="event.stopPropagation();toggleFavorite('${r.id}')">${state.favorites.includes(String(r.id))?'♥':'♡'}</button>
        <div class="emoji">${r.emoji}</div><h3>${r.name}</h3>
        <div class="sub" style="margin-top:3px;margin-bottom:8px">${r.cuisine} · ${r.location}</div>
        <span class="tag">🛵 ${r.distance} km</span><span class="tag g">⏱ ~${r.eta} min</span>
      </div>`).join('') || `<div class="card empty">No restaurants match this filter. Try another cuisine or search.</div>`;
}
function openRestaurant(id, name){ safe(async () => {
  state.restaurant = {id, name}; state.cart = {}; state.bill = null; state.paymentMethod = "Cash on Delivery";
  state.menu = await api("/api/menu?rid=" + id); render();
});}

// ---------------- menu + cart ----------------
function renderMenu(){
  app.innerHTML = `
  <button class="back" onclick="state.restaurant=null;render()">← All restaurants</button>
  <div class="layout">
    <div class="card"><div class="eyebrow" style="color:var(--orange)">FRESH FROM THE KITCHEN</div><h2>${state.restaurant.name}</h2><p class="sub">Choose your items and adjust quantities below.</p>
      ${state.menu.map(m => `
        <div class="menu-item">
          <div><div class="menu-name"><span class="dot ${m.veg?"":"n"}"></span>${m.name}</div><div class="menu-meta">${m.veg?"Vegetarian":"Non-vegetarian"} · ${money(m.price)}</div></div>
          <div class="qty"><button onclick="changeQty('${m.id}',-1)">−</button><span>${state.cart[m.id]||0}</span><button onclick="changeQty('${m.id}',1)">+</button></div>
        </div>`).join("") || `<div class="empty">No items on this menu yet.</div>`}
    </div>
    <div class="card cart" id="cartBox"></div>
  </div>`;
  renderCart();
}
function changeQty(id, d){
  const n = Math.max(0, (state.cart[id]||0) + d);
  if(n === 0) delete state.cart[id]; else state.cart[id] = n;
  renderMenu();
}
async function renderCart(){
  const box = $("#cartBox");
  const lines = Object.entries(state.cart).map(([id, qty]) => ({id, qty}));
  if(!lines.length){ box.innerHTML = `<h2>🛒 Your cart</h2><div class="empty">Cart is empty</div>`; return; }
  try{
    const b = await post("/api/bill", {customer_id:state.customer.id, restaurant_id:state.restaurant.id, cart:cartStr(lines)});
    state.bill = b;
    box.innerHTML = `<h2>🛒 Your cart</h2><p class="sub">Delivering to ${state.customer.location}</p>
      ${b.items.map(i => `<div class="row"><span>${i.name} × ${i.qty}</span><span>${money(i.amount)}</span></div>`).join("")}
      <div class="row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px"><span>Subtotal</span><span>${money(b.subtotal)}</span></div>
      <div class="row"><span>Delivery (${b.distance} km)</span><span>${money(b.delivery)}</span></div>
      <div class="row"><span>GST (5%)</span><span>${money(b.gst)}</span></div>
      <div class="row total"><span>Total</span><span>${money(b.total)}</span></div>
      <button class="btn" style="width:100%;margin-top:14px" onclick="goToPayment()">Continue to payment · ${money(b.total)} →</button>`;
  } catch(e){ box.innerHTML = `<div class="empty">${e.message}</div>`; }
}
function goToPayment(){ state.view = "payment"; render(); }
function renderPayment(){
  if(!state.restaurant || !state.bill || !Object.keys(state.cart).length){ state.view="order"; render(); return; }
  const b = state.bill;
  app.innerHTML = `
    <button class="back" onclick="state.view='order';render()">← Back to cart</button>
    <div class="card" style="max-width:720px;margin:18px auto">
      <div class="step-label"><span>1. Cart ✓</span><span>2. Payment</span><span>3. Confirmation</span></div><div class="eyebrow" style="color:var(--orange)">CHECKOUT</div>
      <h2 style="margin-top:6px">Choose how you want to pay</h2>
      <p class="sub">Select a payment option for your ${state.restaurant.name} order. This is a student project demo.</p>
      <div class="paybox"><div class="row"><span>Restaurant</span><b>${state.restaurant.name}</b></div><div class="row"><span>Items</span><span>${b.items.reduce((n,i)=>n+i.qty,0)} item(s)</span></div><div class="row total"><span>Total payable</span><span>${money(b.total)}</span></div></div>
      <div class="pay-options" style="display:grid;gap:12px;margin:18px 0">
        <label class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer"><input type="radio" name="paymentMethod" value="Cash on Delivery" ${state.paymentMethod==="Cash on Delivery"?"checked":""} onchange="state.paymentMethod=this.value"><span><b>💵 Cash on Delivery</b><br><small class="sub">Pay when your food arrives</small></span></label>
        <label class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer"><input type="radio" name="paymentMethod" value="UPI (Demo)" ${state.paymentMethod==="UPI (Demo)"?"checked":""} onchange="state.paymentMethod=this.value"><span><b>📱 UPI</b><br><small class="sub">Demo payment confirmation</small></span></label>
        <label class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer"><input type="radio" name="paymentMethod" value="Card (Demo)" ${state.paymentMethod==="Card (Demo)"?"checked":""} onchange="state.paymentMethod=this.value"><span><b>💳 Debit / Credit Card</b><br><small class="sub">Demo payment confirmation</small></span></label>
      </div>
      <div class="note">Student project demonstration: UPI and card payments are simulated. No real payment, card number or PIN is collected.</div>
      <button class="btn" style="width:100%;margin-top:16px" onclick="placeOrder()">${state.paymentMethod==="Cash on Delivery"?"Place order":"Pay"} · ${money(b.total)}</button>
    </div>`;
}
function placeOrder(){ safe(async () => {
  const lines = Object.entries(state.cart).map(([id, qty]) => ({id, qty}));
  state.placed = await post("/api/order", {customer_id:state.customer.id, restaurant_id:state.restaurant.id, cart:cartStr(lines), payment_method:state.paymentMethod});
  state.cart = {}; state.restaurant = null; render();
});}

// ---------------- order placed ----------------
function renderPlaced(){
  const o = state.placed;
  const itemCount = o.items.reduce((sum, item) => sum + Number(item.qty), 0);
  app.innerHTML = `<section class="confirm-page">
    <div class="confirm-heading">
      <button class="back" onclick="state.placed=null;render()">← Back to restaurants</button>
      <div class="confirm-brand">PATH2PLATE <span>ORDER CONFIRMATION</span></div>
    </div>
    <div class="confirm-card">
      <div class="confirm-success"><span class="confirm-check">✓</span><div><h2>Your order is confirmed!</h2><p>Order <b>${o.id}</b> · ${o.restaurant}</p></div><span class="confirm-pill">✓ Placed</span></div>
      ${tracker(o.status)}
      <div class="confirm-map-head"><div><span class="eyebrow">DELIVERY ROUTE</span><h3>${o.restaurant} <span>→</span> ${state.customer.location}</h3><p class="sub">Shortest route calculated by Path2Plate · ${o.distance} km</p></div><span class="route-chip">🛵 Rider route</span></div>
      <div class="confirm-map">${drawMap(o.path)}</div>
      <div class="confirm-eta"><div><span class="eyebrow">ESTIMATED DELIVERY</span><div class="eta-number">${o.eta}<small> min</small></div><p>Thanks for ordering local. We’ll keep your order status updated.</p></div><div class="eta-art" aria-hidden="true">🛵</div></div>
      <div class="confirm-details">
        <div class="confirm-detail-block"><div class="confirm-section-title"><span>🧾</span><b>Order summary</b><small>${itemCount} item(s)</small></div>
          ${o.items.map(i => `<div class="row"><span>${i.name} × ${i.qty}</span><span>${money(i.amount)}</span></div>`).join("")}
          <div class="row"><span>Subtotal</span><span>${money(o.subtotal)}</span></div><div class="row"><span>Delivery fee</span><span>${money(o.delivery)}</span></div><div class="row"><span>GST (5%)</span><span>${money(o.gst)}</span></div>
        </div>
        <div class="confirm-total"><div><span>Payment method</span><b>${o.payment_method}</b></div><div><span>Payment status</span><b>${o.payment_status}</b></div><div class="grand-total"><span>Order total</span><strong>${money(o.total)}</strong></div></div>
      </div>
    </div>
    <div class="confirm-actions"><button class="btn" onclick="state.placed=null;render()">Order more</button><button class="btn light" onclick="state.placed=null;state.view='orders';render()">Track my orders</button></div>
    <p class="confirm-footnote">Scooter animation is a visual demo. The route is based on the project’s road network, not live GPS.</p>
  </section>`;
}

// ---------------- my orders ----------------
const FLOW = ["Placed","Preparing","Out for Delivery","Delivered"];
function tracker(status){
  const idx = FLOW.indexOf(status);
  const icons = ["🧾","👨‍🍳","🛵","🏁"];
  const labels = ["Order placed","Preparing","On the way","Delivered"];
  return `<div class="track">${FLOW.map((s,i) => `<div class="step ${i<idx||status==="Delivered"?"done":""} ${i===idx&&status!=="Delivered"?"now":""}"><div class="c">${i<idx||status==="Delivered"?"✓":icons[i]}</div>${labels[i]}</div>`).join("")}</div>`;
}
function riderPanel(o){
  const delivered = o.status === "Delivered";
  const onRoad = o.status === "Out for Delivery";
  const heading = delivered ? "Order delivered!" : onRoad ? "Your food is on the way" : o.status === "Preparing" ? "The kitchen is preparing your order" : "Your order is confirmed";
  const detail = delivered ? "Hope you enjoy your meal. Thanks for ordering with Path2Plate!" :
    onRoad ? `Our delivery partner is travelling about ${o.distance} km to your location.` :
    o.status === "Preparing" ? "Your restaurant is getting everything ready. The rider will head out next." :
    "The restaurant has received your order. We’ll keep the status updated here.";
  return `<div class="tracking-hero"><div><div class="eyebrow">LIVE ORDER UPDATE</div><h3>${heading}</h3><p>${detail}</p><p style="margin-top:7px"><b>${delivered?"Completed":`Estimated delivery: ${o.eta} min`}</b> · Order ${o.id}</p></div><div class="rider-art" aria-hidden="true">${delivered?"🏁":"🛵"}</div></div>`;
}
async function renderMyOrders(){
  const orders = await api("/api/orders?customer_id=" + state.customer.id);
  if(state.view !== "orders") return;
  app.innerHTML = `<h2>My Orders</h2><p class="sub">Status updates automatically every few seconds.</p>` +
    (orders.map(o => `<div class="card">
      <div class="ohead"><div><b>${o.id}</b> · ${o.restaurant}<div class="sub" style="margin:2px 0">${o.time} · ${o.items.map(i=>i.name+" ×"+i.qty).join(", ")}</div></div>
      <div style="text-align:right"><span class="status ${o.status}">${o.status}</span><div style="font-weight:800;margin-top:6px">${money(o.total)}</div></div></div>
      <div class="row"><span>Payment: ${o.payment_method}</span><span>${o.payment_status}</span></div>
      ${riderPanel(o)}
      ${tracker(o.status)}
      <details><summary style="cursor:pointer;color:var(--orange-dark);font-weight:600;font-size:14px;margin-top:10px">View delivery route (${o.distance} km)</summary>
        <p class="sub" style="margin:10px 0">${o.path_names.join(" → ")}</p>${drawMap(o.path)}</details>
    </div>`).join("") || `<div class="card empty">You haven't ordered anything yet.</div>`);
}

// ---------------- admin ----------------
function renderAdmin(){
  if(!state.adminPin){
    app.innerHTML = `<div class="card auth"><h2>Admin login 🔐</h2><p class="sub">Enter the admin PIN (default: 1234)</p>
      <input id="pin" type="password" placeholder="PIN" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn" style="width:100%" onclick="adminLogin()">Login</button></div>`;
    return;
  }
  renderAdminPanel();
}
function adminLogin(){ safe(async () => {
  const pin = $("#pin").value;
  await post("/api/admin/login", {}, {"X-Admin-Pin": pin});
  state.adminPin = pin; render();
});}
async function renderAdminPanel(){
  const [od, customers, rests, menu] = await Promise.all([
    api("/api/admin/orders", {headers:adminH()}), api("/api/admin/customers", {headers:adminH()}),
    api("/api/restaurants"), api("/api/menu?rid=" + state.adminRest)]);
  if(state.view !== "admin") return;
  const nodeOpts = state.map.nodes.map(n => `<option value="${n.id}">${n.name}</option>`).join("");
  const allOrders = od.orders || [];
  const totalOrders = allOrders.length;
  const activeOrders = allOrders.filter(o => o.status !== "Delivered").length;
  const deliveredOrders = allOrders.filter(o => o.status === "Delivered").length;
  const revenue = allOrders.filter(o => o.status === "Delivered").reduce((sum,o) => sum + Number(o.total || 0),0);
  const statusCount = Object.fromEntries(FLOW.map(s => [s,allOrders.filter(o => o.status===s).length]));
  const pct = n => totalOrders ? Math.round(n/totalOrders*100) : 0;
  const avgDistance = totalOrders ? (allOrders.reduce((sum,o)=>sum+Number(o.distance||0),0)/totalOrders).toFixed(1) : "0.0";
  app.innerHTML = `
  <div class="admin-title"><div><div class="eyebrow" style="color:var(--orange)">PATH2PLATE CONTROL ROOM</div><h2>Admin dashboard</h2><p class="sub" style="margin:4px 0 0">A quick overview of orders, customers and restaurant activity.</p></div><span class="admin-badge">● Demo dashboard</span></div>
  <div class="admin-kpis">
    <div class="kpi"><div class="kpi-label">TOTAL ORDERS</div><div class="kpi-value">${totalOrders}</div><div class="kpi-note">All orders received</div></div>
    <div class="kpi"><div class="kpi-label">ACTIVE ORDERS</div><div class="kpi-value">${activeOrders}</div><div class="kpi-note">Still being processed</div></div>
    <div class="kpi"><div class="kpi-label">DELIVERED</div><div class="kpi-value">${deliveredOrders}</div><div class="kpi-note">Successfully completed</div></div>
    <div class="kpi"><div class="kpi-label">DELIVERED REVENUE</div><div class="kpi-value">${money(revenue)}</div><div class="kpi-note">From delivered demo orders</div></div>
  </div>
  <div class="admin-overview">
    <div class="card"><div class="admin-section-title"><h2>📊 Order status overview</h2><span class="tag g">${totalOrders} total</span></div>
      ${FLOW.map((s,i)=>`<div class="status-line"><span style="min-width:112px">${["🧾","👨‍🍳","🛵","🏁"][i]} ${s}</span><b>${statusCount[s]}</b><div class="bar"><i style="width:${pct(statusCount[s])}%"></i></div><small style="color:var(--muted);min-width:34px;text-align:right">${pct(statusCount[s])}%</small></div>`).join("")}
    </div>
    <div class="card"><div class="admin-section-title"><h2>⚡ Quick stats</h2></div>
      <div class="row"><span>Registered customers</span><b>${customers.length}</b></div>
      <div class="row"><span>Restaurants listed</span><b>${rests.length}</b></div>
      <div class="row"><span>Menu items in selected restaurant</span><b>${menu.length}</b></div>
      <div class="row"><span>Average route distance</span><b>${avgDistance} km</b></div>
      <div class="row"><span>Orders waiting in queue</span><b>${od.queue.length}</b></div>
      <p class="note">Revenue counts delivered orders only. This is a simple project dashboard using the app's current order data.</p>
    </div>
  </div>

  <div class="card"><div class="admin-section-title"><div><h2>📋 Order queue (FIFO)</h2><p class="sub" style="margin:4px 0 0">Oldest "Placed" order is processed first, like a queue.</p></div><span class="tag">${od.queue.length} waiting</span></div>
    <div class="qrow"><b style="font-size:14px">Waiting:</b>
      ${od.queue.map((id,i) => `<span class="qchip ${i===0?"first":""}">${id}</span>`).join("") || `<span class="sub" style="margin:0">Queue is empty</span>`}
      <button class="btn small" style="margin-left:auto" onclick="processNext()" ${od.queue.length?"":"disabled"}>Process next order →</button></div>
    <div style="overflow-x:auto"><table><tr><th>Order</th><th>Customer</th><th>Restaurant</th><th>Total</th><th>Distance</th><th>Payment</th><th>Status</th><th></th></tr>
    ${allOrders.map(o => `<tr><td><b>${o.id}</b><br><small style="color:var(--muted)">${o.time}</small></td><td>${o.customer}<br><small style="color:var(--muted)">${o.customer_location}</small></td>
      <td>${o.restaurant}</td><td>${money(o.total)}</td><td>${o.distance} km</td><td>${o.payment_method}<br><small>${o.payment_status}</small></td><td><span class="status ${o.status}">${o.status}</span></td>
      <td>${o.status!=="Delivered" ? `<button class="btn light small" onclick="advance('${o.id}')">Next status</button>` : "✅"}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No orders yet</td></tr>`}
    </table></div></div>

  <div class="two">
    <div class="card"><h2>🍴 Manage menu</h2>
      <select onchange="state.adminRest=this.value;renderAdminPanel()">${rests.map(r => `<option value="${r.id}" ${r.id===state.adminRest?"selected":""}>${r.emoji} ${r.name}</option>`).join("")}</select>
      ${menu.map(m => `<div class="item"><div><span class="dot ${m.veg?"":"n"}"></span>${m.name} <span class="price">${money(m.price)}</span></div>
        <button class="btn danger small" onclick="delItem('${m.id}')">Delete</button></div>`).join("") || `<div class="empty">No items</div>`}
      <div style="margin-top:14px;border-top:2px dashed var(--line);padding-top:12px"><b>Add new item</b>
        <input id="nname" placeholder="Item name" style="margin-top:8px"><input id="nprice" type="number" placeholder="Price (₹)">
        <select id="nveg"><option value="1">Veg</option><option value="0">Non-veg</option></select>
        <button class="btn" onclick="addItem()">Add item</button></div>
    </div>
    <div class="card"><h2>🧭 Route tester</h2><p class="sub">Test Dijkstra between any two locations.</p>
      <label>From</label><select id="rsrc">${nodeOpts}</select><label>To</label><select id="rdst">${state.map.nodes.map((n,i)=>`<option value="${n.id}" ${i===8?"selected":""}>${n.name}</option>`).join("")}</select>
      <button class="btn" onclick="testRoute()">Find shortest route</button>
      <div id="routeOut" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="card"><h2>👥 Registered customers (${customers.length})</h2>
    <table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Location</th></tr>
    ${customers.map(c => `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.location}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">No customers yet</td></tr>`}</table></div>

  <div class="card"><h2>🗺️ Road network</h2><p class="sub">Locations are nodes, roads are weighted edges (adjacency list).</p>${drawMap([])}</div>`;
}
const adminAct = (fn) => safe(async () => { await fn(); renderAdminPanel(); });
function advance(id){ adminAct(() => post("/api/admin/advance", {order_id:id}, adminH())); }
function processNext(){ adminAct(async () => { const o = await post("/api/admin/process-next", {}, adminH()); toast(o.id + " is now " + o.status); }); }
function addItem(){ adminAct(async () => {
  await post("/api/admin/menu/add", {restaurant_id:state.adminRest, name:$("#nname").value, price:$("#nprice").value, veg:$("#nveg").value}, adminH());
  toast("Item added");
});}
function delItem(id){ adminAct(() => post("/api/admin/menu/delete", {id}, adminH())); }
function testRoute(){ safe(async () => {
  const r = await api(`/api/route?src=${$("#rsrc").value}&dst=${$("#rdst").value}`);
  $("#routeOut").innerHTML = `<p><b>${r.distance} km</b> · ${r.path_names.join(" → ")}</p>` + drawMap(r.path);
});}

// ---------------- auto refresh ----------------
setInterval(() => {
  if(state.view === "orders" && state.customer && !document.querySelector("details[open]")) renderMyOrders();
  if(state.view === "admin" && state.adminPin && !document.activeElement.matches("input,select")) renderAdminPanel().catch(()=>{});
}, 5000);

// ---------------- start ----------------
(async function init(){
  state.map = await api("/api/locations");
  const saved = localStorage.getItem("p2p_customer");
  if(saved){ try { state.customer = await api("/api/customer?id=" + saved); } catch(e){ localStorage.removeItem("p2p_customer"); } }
  render();
})();
</script>
</body>
</html>
